# Decap CMS configuration for the UBotix site.
# BEFORE GOING LIVE: change `repo` to your GitHub "username/repository".
backend:
  name: github
  repo: Ronjabs/ubotix-site
  branch: main

# Uncomment while testing on your own computer (run `npx decap-server` in this folder):
# local_backend: true

media_folder: "images/gallery"
public_folder: "images/gallery"

collections:
  - name: "site"
    label: "Site content"
    files:
      - name: "updates"
        label: "Latest updates (news & events)"
        file: "content/updates.json"
        format: "json"
        fields:
          - label: "Updates"
            name: "updates"
            widget: "list"
            summary: "{{fields.date}} - {{fields.title}}"
            fields:
              - { label: "Date", name: "date", widget: "datetime", time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Details", name: "body", widget: "text" }

      - name: "gallery"
        label: "Gallery photos"
        file: "content/gallery.json"
        format: "json"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "Photo", name: "image", widget: "image", media_folder: "/images/gallery", public_folder: "images/gallery" }
              - { label: "Caption", name: "caption", widget: "string" }

      - name: "services"
        label: "Products & services"
        file: "content/services.json"
        format: "json"
        fields:
          - label: "Services"
            name: "services"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Filter group", name: "category", widget: "select", options: ["make", "shop", "train"], hint: "make = Make tab, shop = Shop tab, train = Compete tab" }
              - { label: "Label on card", name: "tag", widget: "string" }
              - { label: "Short description (Services page)", name: "description", widget: "text" }
              - { label: "Bullet points (Home page card)", name: "bullets", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
